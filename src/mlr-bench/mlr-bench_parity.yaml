# Harbor-side repeated parity runs on the stratified 50-task subset
# (parity_subset.txt, generated by select_parity_subset.py, seed 42).
# Run from the repository root, once per run:
#   set -a; source src/mlr-bench/.env; set +a
#   uv run --project src/mlr-bench --extra harbor harbor run \
#     -c src/mlr-bench/mlr-bench_parity.yaml --job-name mlr-bench-parity-run1
datasets:
  - path: datasets/mlr-bench
    task_names:
      - iclr2023-bands
      - iclr2023-dg
      - iclr2023-mrl
      - iclr2023-sr4ad
      - iclr2024-bgpt
      - iclr2024-globalai
      - iclr2024-pml
      - iclr2024-ts4h
      - iclr2025-ai4chl
      - iclr2025-ai4mat
      - iclr2025-buildingtrust
      - iclr2025-data-problems
      - iclr2025-delta
      - iclr2025-scsl
      - iclr2025-wmark
      - iclr2025-wrl
      - iclr2025-xai4science
      - icml2023-aihci
      - icml2023-ilhf
      - icml2023-ncw
      - icml2023-pac
      - icml2023-tagml
      - icml2024-fminwild
      - icml2024-llmandcog
      - icml2024-mfmeai
      - icml2024-ml4lms
      - icml2024-nextgenaisafety
      - icml2024-tifa
      - neurips2023-ai4d3
      - neurips2023-dgm4h
      - neurips2023-dlde
      - neurips2023-federated-learning
      - neurips2023-gaze-meets-ml
      - neurips2023-glfrontiers
      - neurips2023-m3l
      - neurips2023-neurreps
      - neurips2023-tgl
      - neurips2023-xaia
      - neurips2024-ai4mat
      - neurips2024-attrib
      - neurips2024-audio-imagination
      - neurips2024-bdu
      - neurips2024-federated-learning
      - neurips2024-interpretableai
      - neurips2024-m3l
      - neurips2024-mlncp
      - neurips2024-pluralistic-alignment
      - neurips2024-safegenai
      - neurips2024-tsalm
      - neurips2024-video-language-models

agents:
  - import_path: mlr_bench:MlrBenchAgent
    model_name: openai/gpt-5.2

environment:
  type: docker
  delete: true

n_concurrent_trials: 4
